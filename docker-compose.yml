services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro   # live reload: canvis immediats sense rebuild
    depends_on:
      - backend
    networks:
      devnet:
        ipv4_address: 172.30.0.10

  db-probe:
    build: ./observability/db-probe
    environment:
      DATABASE_URL: postgresql://zerto:zerto@db:5432/zerto
    networks:
      devnet:
        ipv4_address: 172.30.0.11

  sys-probe-frontend:
    build: ./observability/sys-probe
    networks:
      devnet:
        ipv4_address: 172.30.0.12

  sys-probe-db:
    build: ./observability/sys-probe
    networks:
      devnet:
        ipv4_address: 172.30.0.13

  zerto-probe:
    build: ./observability/zerto-probe
    networks:
      devnet:
        ipv4_address: 172.30.0.14
      externalnet: {}  # necessita externalnet per arribar als ZVMs (10.20.0.x)

  observability:
    build:
      context: .
      dockerfile: observability/Dockerfile
    ports:
      - "3001:80"
    volumes:
      # live reload: shared CSS/JS from frontend + observability-specific files
      - ./frontend/css:/usr/share/nginx/html/css:ro
      - ./frontend/js/i18n.js:/usr/share/nginx/html/js/i18n.js:ro
      - ./frontend/js/api.js:/usr/share/nginx/html/js/api.js:ro
      - ./frontend/js/charts.js:/usr/share/nginx/html/js/charts.js:ro
      - ./observability/index.html:/usr/share/nginx/html/index.html:ro
      - ./observability/js/app.js:/usr/share/nginx/html/js/app.js:ro
    networks:
      devnet:
        ipv4_address: 172.30.0.20
    # IPs fixes als extra_hosts: quan un contenidor és aturat, nginx rep "connection refused"
    # a la IP Docker en lloc de resolució DNS al host (que apuntaria a producció)
    extra_hosts:
      - "backend:172.30.0.30"
      - "frontend:172.30.0.10"
      - "db-probe:172.30.0.11"
      - "sys-probe-frontend:172.30.0.12"
      - "sys-probe-db:172.30.0.13"
      - "zerto-probe:172.30.0.14"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://zerto:zerto@db:5432/zerto
    volumes:
      - ./backend:/app                         # live reload: canvis immediats sense rebuild
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    networks:
      devnet:
        ipv4_address: 172.30.0.30

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zerto
      POSTGRES_PASSWORD: zerto
      POSTGRES_DB: zerto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerto"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      devnet:
        ipv4_address: 172.30.0.40

networks:
  devnet:
    ipam:
      config:
        - subnet: 172.30.0.0/24   # subxarxa fixa: les IPs dels contenidors no canvien mai
  externalnet: {}    # xarxa amb sortida a internet, només per a zerto-probe (ZVMs 10.20.0.x)

volumes:
  pgdata:
