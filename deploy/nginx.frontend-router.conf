# nginx router — Frontend VM (10.20.0.146)
# Enruta peticions al contenidor del demo correcte per Host header.
#
# Deploy:
#   sudo cp nginx.frontend-router.conf /etc/nginx/sites-available/frontend-router
#   sudo ln -sf /etc/nginx/sites-available/frontend-router /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# processed-meat (pas 1) — també respon a l'hostname original frontend.tec.bcn
server {
    listen 80;
    server_name processed-meat.tec.bcn frontend.tec.bcn;

    resolver 127.0.0.53 valid=10s;

    location / {
        proxy_pass             http://127.0.0.1:8080;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout  3s;
        proxy_read_timeout     60s;
    }
}

