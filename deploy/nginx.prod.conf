server {
    listen 80;
    server_name frontend.tec.bcn;   # <-- canvia pel teu domini o IP

    root /var/www/html;
    index index.html;

    # JS/CSS sense cache per facilitar desplegaments
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Proxy de totes les crides API cap al backend
    # IMPORTANT: la barra final a proxy_pass elimina el prefix /api/ abans de reenviar
    location /api/ {
        proxy_pass         http://10.20.0.147:8000/;   # <-- IP del backend VM
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback — totes les rutes retornen index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
