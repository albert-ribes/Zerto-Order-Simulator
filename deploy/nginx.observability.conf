server {
    listen 80;
    server_name obsdemo.tec.bcn;

    root /var/www/html;
    index index.html;

    # Resolver amb TTL curt: resol noms en cada petició (no a l'arrencada).
    # Evita que nginx falli a l'inici si el DNS no és disponible quan arrenca.
    resolver 127.0.0.53 valid=10s;

    set $backend_up  http://backend.tec.bcn:8000;
    set $frontend_up http://frontend.tec.bcn:80;
    set $fe_sys_up   http://frontend.tec.bcn:5001;
    set $db_sys_up   http://postgresql.tec.bcn:5001;

    # JS/CSS sense cache per facilitar desplegaments
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy API → backend
    # Nota: amb proxy_pass sobre variable cal rewrite explícit per eliminar el
    # prefix de location; nginx NO fa el stripping automàtic en aquest cas.
    location /api/ {
        rewrite                ^/api/(.*)$ /$1 break;
        proxy_pass             $backend_up;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout  3s;
        proxy_read_timeout     10s;
    }

    # Infra check: frontend
    location ^~ /check/frontend/ {
        rewrite                ^/check/frontend/(.*)$ /$1 break;
        proxy_pass             $frontend_up;
        proxy_set_header       Host $host;
        proxy_connect_timeout  3s;
        proxy_read_timeout     5s;
    }

    # Infra check: db-probe (servei local al port 5000)
    location ^~ /check/db/ {
        rewrite                ^/check/db/(.*)$ /$1 break;
        proxy_pass             http://127.0.0.1:5000;
        proxy_set_header       Host $host;
        proxy_connect_timeout  3s;
        proxy_read_timeout     5s;
    }

    # Sys-probe: mètriques del servidor frontend
    location ^~ /check/frontend-sys/ {
        rewrite                ^/check/frontend-sys/(.*)$ /$1 break;
        proxy_pass             $fe_sys_up;
        proxy_set_header       Host $host;
        proxy_connect_timeout  3s;
        proxy_read_timeout     5s;
    }

    # Sys-probe: mètriques del servidor de base de dades
    location ^~ /check/db-sys/ {
        rewrite                ^/check/db-sys/(.*)$ /$1 break;
        proxy_pass             $db_sys_up;
        proxy_set_header       Host $host;
        proxy_connect_timeout  3s;
        proxy_read_timeout     5s;
    }

    # Zerto probe (servei local al port 5002)
    location ^~ /check/zerto/ {
        proxy_pass             http://127.0.0.1:5002/;
        proxy_set_header       Host $host;
        proxy_connect_timeout  5s;
        proxy_read_timeout     20s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
