server {
    listen 80;
    server_name obsdemo.tec.bcn;

    root /var/www/html;
    index index.html;

    # JS/CSS sense cache per facilitar desplegaments
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy API → backend
    location /api/ {
        proxy_pass             http://backend.tec.bcn:8000/;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout  3s;
        proxy_read_timeout     10s;
    }

    # Infra check: frontend
    location ^~ /check/frontend/ {
        proxy_pass             http://frontend.tec.bcn:80/;
        proxy_set_header       Host $host;
        proxy_connect_timeout  3s;
        proxy_read_timeout     5s;
    }

    # Infra check: db-probe (servei local al port 5000)
    location ^~ /check/db/ {
        proxy_pass             http://127.0.0.1:5000/;
        proxy_set_header       Host $host;
        proxy_connect_timeout  3s;
        proxy_read_timeout     5s;
    }

    # Sys-probe: mètriques del servidor frontend
    location ^~ /check/frontend-sys/ {
        proxy_pass             http://frontend.tec.bcn:5001/;
        proxy_set_header       Host $host;
        proxy_connect_timeout  3s;
        proxy_read_timeout     5s;
    }

    # Sys-probe: mètriques del servidor de base de dades
    location ^~ /check/db-sys/ {
        proxy_pass             http://postgresql.tec.bcn:5001/;
        proxy_set_header       Host $host;
        proxy_connect_timeout  3s;
        proxy_read_timeout     5s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
