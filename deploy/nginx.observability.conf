server {
    listen 80;
    server_name observability.tec.bcn;

    root /var/www/html;
    index index.html;

    # JS/CSS sense cache per facilitar desplegaments
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Proxy de totes les crides API cap al backend
    location /api/ {
        proxy_pass         http://10.20.0.147:8000/;   # <-- mateixa IP backend que el frontend
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
