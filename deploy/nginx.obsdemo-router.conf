# nginx router — ObsDemo VM (10.20.0.149)
# Enruta peticions a les consoles obs per Host header.
#
# Deploy:
#   sudo cp nginx.obsdemo-router.conf /etc/nginx/sites-available/obsdemo-router
#   sudo ln -sf /etc/nginx/sites-available/obsdemo-router /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/observability
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name portal.tec.bcn;

    resolver 127.0.0.53 valid=10s;

    location / {
        proxy_pass             http://127.0.0.1:8089;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout  3s;
        proxy_read_timeout     60s;
    }
}

# Retrocompatibilitat: obsdemo.tec.bcn → portal
server {
    listen 80;
    server_name obsdemo.tec.bcn;
    return 301 http://portal.tec.bcn$request_uri;
}

