server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # IPs fixes definides al docker-compose (subnet 172.30.0.0/24).
    # Usar IPs directes en lloc de noms DNS evita que nginx faci fallback
    # al DNS del host quan un contenidor és aturat, cosa que a Docker Desktop
    # (Windows) resoldria "backend" → backend.TEC.bcn (producció).
    set $be_upstream          http://172.30.0.30:8000;
    set $fe_upstream          http://172.30.0.10:80;
    set $dbprobe_upstream     http://172.30.0.11:5000;
    set $sysprobe_fe_upstream http://172.30.0.12:5001;
    set $sysprobe_db_upstream  http://172.30.0.13:5001;
    set $zertoprobe_upstream   http://172.30.0.14:5002;

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend (rewrite strips /api/ prefix)
    location /api/ {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $be_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # Proxy to frontend for infra health checks.
    location ^~ /check/frontend/ {
        rewrite            ^/check/frontend/(.*)$ /$1 break;
        proxy_pass         $fe_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # Proxy to db-probe (direct PostgreSQL check, independent of backend)
    location ^~ /check/db/ {
        rewrite            ^/check/db/(.*)$ /$1 break;
        proxy_pass         $dbprobe_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # Proxy to sys-probe on frontend server (system metrics)
    location ^~ /check/frontend-sys/ {
        rewrite            ^/check/frontend-sys/(.*)$ /$1 break;
        proxy_pass         $sysprobe_fe_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # Proxy to sys-probe on database server (system metrics)
    location ^~ /check/db-sys/ {
        rewrite            ^/check/db-sys/(.*)$ /$1 break;
        proxy_pass         $sysprobe_db_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # Proxy to zerto-probe (Zerto API aggregator)
    location ^~ /check/zerto/ {
        rewrite            ^/check/zerto/(.*)$ /$1 break;
        proxy_pass         $zertoprobe_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
    }
}
