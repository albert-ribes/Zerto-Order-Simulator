server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver so nginx resolves hostnames
    # per-request instead of only at startup — allows the container to
    # keep running even when other services are temporarily down.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Variables force nginx to use the resolver per-request instead of
    # caching the IP at startup — survives backend/frontend/db-probe restarts.
    set $be_upstream          http://backend:8000;
    set $fe_upstream          http://frontend:80;
    set $dbprobe_upstream     http://db-probe:5000;
    set $sysprobe_fe_upstream http://sys-probe-frontend:5001;
    set $sysprobe_db_upstream http://sys-probe-db:5001;

    # Proxy API calls to backend (rewrite strips /api/ prefix)
    location /api/ {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $be_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # Proxy to frontend for infra health checks.
    location ^~ /check/frontend/ {
        rewrite            ^/check/frontend/(.*)$ /$1 break;
        proxy_pass         $fe_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # Proxy to db-probe (direct PostgreSQL check, independent of backend)
    location ^~ /check/db/ {
        rewrite            ^/check/db/(.*)$ /$1 break;
        proxy_pass         $dbprobe_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # Proxy to sys-probe on frontend server (system metrics)
    location ^~ /check/frontend-sys/ {
        rewrite            ^/check/frontend-sys/(.*)$ /$1 break;
        proxy_pass         $sysprobe_fe_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # Proxy to sys-probe on database server (system metrics)
    location ^~ /check/db-sys/ {
        rewrite            ^/check/db-sys/(.*)$ /$1 break;
        proxy_pass         $sysprobe_db_upstream;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }
}
