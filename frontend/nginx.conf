server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # IP fixa definida al docker-compose (subnet 172.30.0.0/24).
    # Usar IP directa en lloc de nom DNS evita que nginx faci fallback
    # al DNS del host quan el contenidor backend és aturat, cosa que a Docker Desktop
    # (Windows) resoldria "backend" → backend.TEC.bcn (producció).
    set $be_upstream http://172.30.0.30:8000;

    # Dev mode: no caching for JS/CSS so updates are reflected immediately
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $be_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }
}
