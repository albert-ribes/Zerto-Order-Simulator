# PostgreSQL VM (10.20.0.148)
#
# Ports:  processed-meat → 5432       hospital → 5433       flight-booking → 5434
# Probes: db-probe per demo → 5000 / 5010 / 5020            sys-probe → 5001
#
# Volumes (bind mounts — accessible des del host per als scripts de demo):
#   /data/processed-meat/postgresql  ← encrypt/restore scripts apunten aquí
#   /data/hospital/postgresql        ← hospital encrypt/restore
#   /data/flight-booking/postgresql  ← flight-booking encrypt/restore

services:
  processed-meat-postgresql:
    image: postgres:16
    container_name: processed-meat-postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - /data/processed-meat/postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: zerto
      POSTGRES_PASSWORD: zerto
      POSTGRES_DB: zerto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerto"]
      interval: 5s
      timeout: 5s
      retries: 5

  hospital-postgresql:
    image: postgres:16-alpine
    container_name: hospital-postgresql
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - /data/hospital/postgresql:/var/lib/postgresql/data/pgdata
      - /opt/zerto/hospital/hdm-database/sql:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: hdm_db
      POSTGRES_USER: hdm_user
      POSTGRES_PASSWORD: hdm_pass_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdm_user -d hdm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  flight-booking-postgresql:
    image: postgres:16-alpine
    container_name: flight-booking-postgresql
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - /data/flight-booking/postgresql:/var/lib/postgresql/data/pgdata
      - /opt/zerto/flight-booking/fb-database/initdb/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh
      - /opt/zerto/flight-booking/fb-database-src/migrations:/docker-entrypoint-initdb.d/migrations
      - /opt/zerto/flight-booking/fb-database-src/seeds:/docker-entrypoint-initdb.d/seeds
    environment:
      POSTGRES_DB: flight_booking
      POSTGRES_USER: flight_app
      POSTGRES_PASSWORD: flight_pass_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_app -d flight_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── DB Probes (one per demo, container name = PostgreSQL container) ──────────
  processed-meat-db-probe:
    image: db-probe:latest
    container_name: processed-meat-db-probe
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://zerto:zerto@processed-meat-postgresql:5432/zerto
    depends_on:
      processed-meat-postgresql:
        condition: service_healthy

  hospital-db-probe:
    image: db-probe:latest
    container_name: hospital-db-probe
    restart: unless-stopped
    ports:
      - "5010:5000"
    environment:
      DATABASE_URL: postgresql://hdm_user:hdm_pass_2024@hospital-postgresql:5432/hdm_db
    depends_on:
      hospital-postgresql:
        condition: service_healthy

  flight-booking-db-probe:
    image: db-probe:latest
    container_name: flight-booking-db-probe
    restart: unless-stopped
    ports:
      - "5020:5000"
    environment:
      DATABASE_URL: postgresql://flight_app:flight_pass_2024@flight-booking-postgresql:5432/flight_booking
    depends_on:
      flight-booking-postgresql:
        condition: service_healthy

  # ── Sys Probe (DB VM) ────────────────────────────────────────────────────────
  sys-probe:
    image: sys-probe:latest
    container_name: sys-probe
    restart: unless-stopped
    ports:
      - "5001:5001"
