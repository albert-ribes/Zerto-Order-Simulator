# Backend VM (10.20.0.147)
#
# Ports:  processed-meat → 8000
#         hospital        → 8001
#         flight-booking  → 8002  (step 3)
# Probes: sys-probe → 5001

services:
  processed-meat-backend:
    image: processed-meat-backend:latest
    container_name: processed-meat-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://zerto:zerto@10.20.0.148:5432/zerto

  hospital-backend:
    image: hospital-backend:latest
    container_name: hospital-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DB_HOST: 10.20.0.148
      DB_PORT: 5433
      DB_NAME: hdm_db
      DB_USER: hdm_user
      DB_PASS: hdm_pass_2024

  flight-booking-backend:
    image: flight-booking-backend:latest
    container_name: flight-booking-backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://flight_app:flight_pass_2024@10.20.0.148:5434/flight_booking

  # ── Sys Probe (backend VM) ─────────────────────────────────────────────────
  # /containers: the Docker socket is root-equivalent even when mounted :ro.
  sys-probe:
    image: sys-probe:latest
    container_name: sys-probe
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PROBE_CONTAINERS: processed-meat-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
