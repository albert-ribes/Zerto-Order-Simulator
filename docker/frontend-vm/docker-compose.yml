# Frontend VM (10.20.0.146)
# Host nginx router: /etc/nginx/sites-available/frontend-router (see deploy/)
#
# Ports:  processed-meat → 8080       hospital → 8081       flight-booking → 8082
# Probes: sys-probe → 5001            zerto-probe → 5002
#
# Les consoles d'observabilitat (8090/8091/8092) corren a obsdemo.tec.bcn (10.20.0.149)

services:
  processed-meat-frontend:
    image: processed-meat-frontend:latest
    container_name: processed-meat-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://10.20.0.147:8000

  hospital-frontend:
    image: hospital-frontend:latest
    container_name: hospital-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      BACKEND_URL: http://10.20.0.147:8001

  flight-booking-frontend:
    image: flight-booking-frontend:latest
    container_name: flight-booking-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      BACKEND_URL: http://10.20.0.147:8002

  # ── Probes (frontend VM) ─────────────────────────────────────────────────────
  sys-probe:
    image: sys-probe:latest
    container_name: sys-probe
    restart: unless-stopped
    ports:
      - "5001:5001"

  zerto-probe:
    image: zerto-probe:latest
    container_name: zerto-probe
    restart: unless-stopped
    ports:
      - "5002:5002"
